
<div class="ekart--products--container"  >
   <div class="ekart--product--item" *ngFor="let pro of products">
    <div class="ekart-wishlist-sale-container">
        <div class="ekart--add--to--wishlist">
          <i class="fa fa-heart-o" aria-hidden="true"></i>
        </div>
        <div class="ekart-on-sale-tag">75% OFF</div>
      </div>
      <div class="ekart--product--image">
          <img src="IMGSRC" class="ekart--product--image">
      </div>
      <div class="ekart--add--to--price">
          {{pro.price}}
      </div>
      <div class="ekart--product--name">{{pro.name}}</div>
      <div class="ekart--product--category">{{pro.brand}}</div>
      <div class="ekart--product--available-colors">{{pro.color}}</div>
      <div class="ekart--product--available-colors">{{pro.category}}</div>
      <div class="ekart--product--available-colors">{{ pro.is_in_inventory}}</div>
      <div class="ekart--product--available-colors">{{ productCount}}</div>

      


 
</div>
</div>





 <h1>website component  parent component</h1>
 <h2 *ngFor="let item of products">{{item.name}}</h2>
